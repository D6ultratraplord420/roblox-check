<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hackzorGUI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #15112b;
    --panel: #1f1a3d;
    --text: #f1eefc;
    --muted: #a9a3cc;
    --accent: #ff5d8f;
    --accent-hover: #ff7fa5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 56px 20px 72px;
  }
  main { width: 100%; max-width: 860px; }
  h1 {
    font-size: clamp(2.4rem, 8vw, 4.5rem);
    line-height: 1;
    letter-spacing: -0.03em;
    margin: 0 0 12px;
    font-weight: 700;
  }
  p.sub {
    color: var(--muted);
    font-size: 1.1rem;
    margin: 0 0 32px;
    max-width: 52ch;
  }
  .video {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: var(--panel);
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 32px;
  }
  .video video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #000;
  }
  .download {
    display: inline-block;
    background: var(--accent);
    color: #1a0a12;
    font: inherit;
    font-weight: 700;
    font-size: 1.15rem;
    text-decoration: none;
    padding: 16px 32px;
    border-radius: 10px;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .download:hover { background: var(--accent-hover); }
  .download:active { transform: translateY(1px); }
  .download:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    .download { transition: none; }
  }
</style>
</head>
<body>
  <main>
    <h1>hackzorGUI</h1>
    <p class="sub">Watch the demo, then download it below.</p>

    <!-- Put your video file in the same folder as this page and name it demo.mp4 (or change the name below) -->
    <div class="video">
      <video controls preload="metadata" playsinline>
        <source src="demo.mp4" type="video/mp4">
        Your browser can't play this video.
      </video>
    </div>

    <!-- Replace the href with your MediaFire link -->
    <a class="download" href="https://www.mediafire.com/file/7z2qy87akc8fgsh/HackzorGUI.exe/file" target="_blank" rel="noopener">Download hackzorGUI</a>
  </main>
</body>
</html>
