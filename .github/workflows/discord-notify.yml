```yaml
name: Hackzor Patch Notes

on:
  push:
    paths:
      - '*.ps1'
      - '*.py'
      - '*.cs'
      - '*.js'
      - '*.css'
      - '*.html'
      - '**/*.ps1'
      - '**/*.py'
      - '**/*.cs'
      - '**/*.js'
      - '**/*.css'
      - '**/*.html'

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Generate and send patch notes
        env:
          RELAY_URL: ${{ secrets.PATCH_RELAY_URL }}
          RELAY_TOKEN: ${{ secrets.PATCH_RELAY_TOKEN }}
          AUTHOR: ${{ github.actor }}
          COMMIT: ${{ github.event.head_commit.message }}
          COMPARE_URL: ${{ github.event.compare }}

        run: |
          python3 <<'PY'
          import os
          import re
          import json
          import subprocess
          import urllib.request
          import urllib.error

          relay_url = os.environ.get("RELAY_URL", "").strip()
          relay_token = os.environ.get("RELAY_TOKEN", "").strip()
          author = os.environ.get("AUTHOR", "Unknown")
          commit = os.environ.get("COMMIT", "Code update")
          compare = os.environ.get("COMPARE_URL", "")

          if not relay_url.startswith("https://"):
              raise RuntimeError("PATCH_RELAY_URL must start with https://")

          if "workers.dev" not in relay_url:
              raise RuntimeError("Unexpected relay URL.")

          if not relay_token:
              raise RuntimeError("PATCH_RELAY_TOKEN is missing.")

          def git(*args):
              return subprocess.check_output(
                  ["git", *args],
                  text=True,
                  stderr=subprocess.DEVNULL
              )

          raw_files = git(
              "diff-tree", "--no-commit-id", "--name-status",
              "-r", "HEAD"
          ).splitlines()

          labels = {
              "A": "🟢 Added",
              "M": "🟡 Modified",
              "D": "🔴 Removed",
              "R": "🔵 Renamed"
          }

          files = []

          for item in raw_files:
              parts = item.split("\t")
              if len(parts) >= 2:
                  status = parts[0][0]
                  filename = parts[-1]
                  files.append(
                      f"{labels.get(status, '📄 Changed')}: `{filename}`"
                  )

          diff = git(
              "show", "--format=", "--no-ext-diff",
              "--unified=0", "HEAD"
          )

          sensitive = re.compile(
              r"webhook|password|secret|token|api[_-]?key|"
              r"authorization|private[_-]?key",
              re.I
          )

          def classify_line(line, filename):
              stripped = line.strip()
              ext = os.path.splitext(filename)[1].lower()

              if not stripped:
                  return "BLANK"

              if ext in (".py", ".ps1", ".sh", ".rb", ".yaml", ".yml"):
                  if stripped.startswith("#"):
                      return "COMMENT"

              if ext in (".js", ".cs", ".css", ".java", ".c", ".cpp"):
                  if stripped.startswith("//") or stripped.startswith("/*") or stripped.startswith("*"):
                      return "COMMENT"

              if ext in (".html", ".xml"):
                  if "<!--" in stripped or stripped.startswith("<!--"):
                      return "COMMENT"

              return "CODE"

          additions = []
          removals = []

          current_file = "unknown"
          new_line = 0
          old_line = 0

          for line in diff.splitlines():
              if line.startswith("diff --git "):
                  match = re.match(r"diff --git a/(.*?) b/(.*)", line)
                  if match:
                      current_file = match.group(2)
                  continue

              if line.startswith("@@"):
                  match = re.search(
                      r"-(\d+)(?:,\d+)? \+(\d+)(?:,\d+)?",
                      line
                  )
                  if match:
                      old_line = int(match.group(1))
                      new_line = int(match.group(2))
                  continue

              if line.startswith("+++ ") or line.startswith("--- "):
                  continue

              if line.startswith("+"):
                  value = line[1:]

                  if value.strip() and not sensitive.search(value):
                      kind = classify_line(value, current_file)
                      additions.append(
                          f"🟢 `{current_file}:{new_line}` [{kind}]\n"
                          f"```{value[:300]}```"
                      )

                  new_line += 1

              elif line.startswith("-"):
                  value = line[1:]

                  if value.strip() and not sensitive.search(value):
                      kind = classify_line(value, current_file)
                      removals.append(
                          f"🔴 `{current_file}:{old_line}` [{kind}]\n"
                          f"```{value[:300]}```"
                      )

                  old_line += 1

              elif line.startswith(" "):
                  old_line += 1
                  new_line += 1

          changes = additions + removals

          if not changes:
              changes = ["No readable code or comment lines detected."]

          if len(changes) > 12:
              changes = changes[:12] + [
                  f"…and {len(changes) - 12} more changed lines. "
                  "Open the compare link for the full diff."
              ]

          changes_text = "\n\n".join(changes)
          files_text = "\n".join(files[:15]) or "No file details available."

          message = commit.lower()

          if any(word in message for word in ["fix", "bug"]):
              kind = "🐛 BUG FIX"
              color = 15158332
          elif any(word in message for word in ["add", "new", "feature"]):
              kind = "✨ NEW FEATURE"
              color = 3066993
          else:
              kind = "🔄 UPDATE"
              color = 5793266

          payload = {
              "embeds": [{
                  "title": f"🚀 HACKZOR PATCH NOTES | {kind}",
                  "description": (
                      "**📝 Exact Lines Changed**\n"
                      "🟢 Added | 🔴 Removed | CODE | COMMENT\n\n"
                      f"{changes_text}"
                  )[:4000],
                  "color": color,
                  "fields": [
                      {
                          "name": "👤 Developer",
                          "value": author[:100],
                          "inline": True
                      },
                      {
                          "name": "📁 Files Changed",
                          "value": files_text[:1000],
                          "inline": False
                      },
                      {
                          "name": "💬 Commit",
                          "value": commit[:1000],
                          "inline": False
                      }
                  ],
                  "footer": {
                      "text": "Hackzor GUI • Automated Development Feed"
                  }
              }]
          }

          if compare.startswith("https://github.com/"):
              payload["embeds"][0]["url"] = compare

          request = urllib.request.Request(
              relay_url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "User-Agent": "Hackzor-Patch-Notes/1.0",
                  "Authorization": "Bearer " + relay_token
              },
              method="POST"
          )

          print("Sending exact-line patch notes through Cloudflare...")

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  print("SUCCESS:", response.status)
                  print(response.read().decode("utf-8", errors="replace"))

          except urllib.error.HTTPError as error:
              details = error.read().decode("utf-8", errors="replace")
              print("Relay request failed:", error.code, details)
              raise

          PY
```
