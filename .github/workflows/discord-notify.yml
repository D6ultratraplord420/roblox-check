
name: Hackzor Patch Notes

on:
  push:
    paths:
      - '*.ps1'
      - '*.py'
      - '*.cs'
      - '*.js'
      - '*.css'
      - '*.html'
      - '**/*.ps1'
      - '**/*.py'
      - '**/*.cs'
      - '**/*.js'
      - '**/*.css'
      - '**/*.html'

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Generate and send patch notes
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          AUTHOR: ${{ github.actor }}
          COMMIT: ${{ github.event.head_commit.message }}
          COMPARE_URL: ${{ github.event.compare }}

        run: |
          python3 <<'PY'
          import os
          import re
          import json
          import subprocess
          import urllib.request
          import urllib.error

          webhook = os.environ.get("WEBHOOK", "").strip()
          author = os.environ.get("AUTHOR", "Unknown")
          commit = os.environ.get("COMMIT", "Code update")
          compare = os.environ.get("COMPARE_URL", "")

          if not webhook:
              raise RuntimeError("DISCORD_WEBHOOK_URL secret is missing.")

          if not webhook.startswith("https://discord.com/api/webhooks/") and not webhook.startswith("https://discordapp.com/api/webhooks/"):
              raise RuntimeError("Webhook secret does not look like a valid Discord webhook URL.")

          def git(*args):
              return subprocess.check_output(
                  ["git", *args],
                  text=True,
                  stderr=subprocess.DEVNULL
              )

          # Find changed files
          raw_files = git(
              "diff-tree", "--no-commit-id",
              "--name-status", "-r", "HEAD"
          ).splitlines()

          files = []
          for item in raw_files:
              parts = item.split("\t")
              if len(parts) < 2:
                  continue

              status = parts[0][0]
              filename = parts[-1]

              labels = {
                  "A": "🟢 Added",
                  "M": "🟡 Modified",
                  "D": "🔴 Removed",
                  "R": "🔵 Renamed"
              }

              files.append(f"{labels.get(status, '📄 Changed')}: `{filename}`")

          # Retrieve actual code changes
          diff = git(
              "show", "--format=", "--no-ext-diff",
              "--unified=0", "HEAD"
          )

          additions = []
          removals = []

          sensitive = re.compile(
              r"webhook|password|secret|token|api[_-]?key|"
              r"authorization|private[_-]?key",
              re.I
          )

          for line in diff.splitlines():
              if line.startswith(("+++", "---")):
                  continue

              if line.startswith("+"):
                  value = line[1:].strip()
                  if value and not sensitive.search(value):
                      additions.append(value)

              elif line.startswith("-"):
                  value = line[1:].strip()
                  if value and not sensitive.search(value):
                      removals.append(value)

          def summarize(line):
              if re.search(r"\bfunction\s+\w+", line, re.I):
                  return "Added or updated a function"
              if re.search(r"\b(if|elseif|else)\b", line, re.I):
                  return "Updated conditional logic"
              if re.search(r"\b(try|catch|finally)\b", line, re.I):
                  return "Updated error handling"
              if re.search(r"\b(import|using|require)\b", line, re.I):
                  return "Updated imports or dependencies"
              if re.search(r"\b(version|build)\w*\s*=", line, re.I):
                  return f"Updated version/build setting: `{line[:100]}`"
              if "=" in line:
                  return f"Updated setting: `{line[:100]}`"
              return f"Changed code: `{line[:100]}`"

          changes = []
          seen = set()

          for line in additions:
              item = "➕ " + summarize(line)
              if item not in seen:
                  changes.append(item)
                  seen.add(item)

          for line in removals:
              item = "➖ Removed: " + summarize(line)
              if item not in seen:
                  changes.append(item)
                  seen.add(item)

          if not changes:
              changes = ["No readable code changes detected."]

          if len(changes) > 10:
              changes = changes[:10] + [
                  f"…and {len(changes) - 10} more changes."
              ]

          files_text = "\n".join(files[:15]) or "No file details available."
          changes_text = "\n".join(changes)

          message = commit.lower()

          if any(word in message for word in ["fix", "bug"]):
              kind, color = "🐛 BUG FIX", 15158332
          elif any(word in message for word in ["add", "new", "feature"]):
              kind, color = "✨ NEW FEATURE", 3066993
          else:
              kind, color = "🔄 UPDATE", 5793266

          payload = {
              "embeds": [{
                  "title": f"🚀 HACKZOR PATCH NOTES | {kind}",
                  "description": f"**📝 What Changed**\n{changes_text}"[:4000],
                  "color": color,
                  "fields": [
                      {
                          "name": "👤 Developer",
                          "value": author[:100],
                          "inline": True
                      },
                      {
                          "name": "📁 Files Changed",
                          "value": files_text[:1000],
                          "inline": False
                      },
                      {
                          "name": "💬 Commit",
                          "value": commit[:1000],
                          "inline": False
                      }
                  ],
                  "footer": {
                      "text": "Hackzor GUI • Automated Development Feed"
                  }
              }]
          }

          if compare.startswith("https://github.com/"):
              payload["embeds"][0]["url"] = compare

          request = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  print("SUCCESS: Discord notification sent.")
                  print("HTTP status:", response.status)

          except urllib.error.HTTPError as error:
              print("DISCORD REJECTED THE NOTIFICATION")
              print("HTTP status:", error.code)
              print("Discord response:")
              print(error.read().decode("utf-8", errors="replace"))
              raise

          except Exception as error:
              print("NOTIFICATION ERROR:", repr(error))
              raise
          PY
