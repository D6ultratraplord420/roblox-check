
name: Hackzor Patch Notes

on:
  push:
    paths:
      - 'index.html'
      - '**/*.ps1'
      - '**/*.py'
      - '**/*.cs'
      - '**/*.js'
      - '**/*.css'
      - '**/*.html'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Patch Notes
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMIT: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.actor }}
          URL: ${{ github.event.compare }}
          ADDED: ${{ toJson(github.event.head_commit.added) }}
          MODIFIED: ${{ toJson(github.event.head_commit.modified) }}
          REMOVED: ${{ toJson(github.event.head_commit.removed) }}
        run: |
          MESSAGE=$(echo "$COMMIT" | tr '[:upper:]' '[:lower:]')

          COLOR=5793266
          TYPE="🔄 UPDATE"

          if [[ "$MESSAGE" == *"fix"* || "$MESSAGE" == *"bug"* ]]; then
            COLOR=15158332
            TYPE="🐛 BUG FIX"
          elif [[ "$MESSAGE" == *"add"* || "$MESSAGE" == *"new"* || "$MESSAGE" == *"feature"* ]]; then
            COLOR=3066993
            TYPE="✨ NEW FEATURE"
          fi

          FILES=$(jq -n \
            --argjson added "$ADDED" \
            --argjson modified "$MODIFIED" \
            --argjson removed "$REMOVED" \
            '(["🟢 Added:"] + $added + ["🟡 Modified:"] + $modified + ["🔴 Removed:"] + $removed) | join("\n")')

          PAYLOAD=$(jq -n \
            --arg type "$TYPE" \
            --arg author "$AUTHOR" \
            --arg commit "$COMMIT" \
            --arg url "$URL" \
            --arg files "$FILES" \
            --argjson color "$COLOR" \
            '{
              embeds: [{
                title: ("🚀 HACKZOR PATCH NOTES | " + $type),
                description: $commit,
                color: $color,
                fields: [
                  {name: "👤 Developer", value: $author, inline: true},
                  {name: "📁 Files Changed", value: ($files[0:1000]), inline: false}
                ],
                url: $url,
                footer: {text: "Hackzor GUI • Automated Development Feed"}
              }]
            }')

          curl -fsS -H "Content-Type: application/json" \
            -d "$PAYLOAD" "$WEBHOOK"
